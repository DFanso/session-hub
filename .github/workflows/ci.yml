name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test with coverage
        run: bun test --coverage

      - name: Audit dependencies
        run: bun audit --audit-level=high

      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "${tmp}/${tarball}" "${base}/${tarball}"
          curl -fsSL -o "${tmp}/checksums.txt" "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          echo "${GITLEAKS_SHA256}  ${tmp}/${tarball}" | sha256sum --check --strict -
          (cd "${tmp}" && grep " ${tarball}\$" checksums.txt | sha256sum --check --strict -)
          tar -xzf "${tmp}/${tarball}" -C "${tmp}" gitleaks
          "${tmp}/gitleaks" git --redact --config .gitleaks.toml --exit-code 1

  gui:
    env:
      EnableWindowsTargeting: "true"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        # Installs into this job's own temp dir. `runner` is not available in jobs.<id>.env, so this
        # is step-level.
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore gui/SessionHub.sln -p:RestoreLockedMode=true

      - name: Test
        run: dotnet test gui/SessionHub.Tests --no-restore

      - name: Build tray (warnings are errors)
        run: dotnet build gui/SessionHub.Tray -p:EnableWindowsTargeting=true -warnaserror --no-restore

      # The shipped artifact: the same publish as scripts/build.ts, with its own locked restore
      # (the publish profile adds the win-x64 RID), so a profile or lock drift fails here first.
      - name: Publish tray (as shipped)
        run: >-
          dotnet publish gui/SessionHub.Tray -c Release -p:PublishProfile=SingleFile
          -p:RestoreLockedMode=true -p:EnableWindowsTargeting=true
          -o "$RUNNER_TEMP/tray-publish"
